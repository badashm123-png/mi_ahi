<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מי הכי? | KICK</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap">
<style>
:root{--bg:#0b0e0f;--panel:#16191b;--line:#2a2f32;--ink:#f2f4f3;--mute:#8d9693;--k:#53fc18;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e0f;--panel:#16191b;--line:#2a2f32;--ink:#f2f4f3;--mute:#8d9693;--k:#53fc18}}
:root[data-theme="dark"]{--bg:#0b0e0f;--panel:#16191b;--line:#2a2f32;--ink:#f2f4f3;--mute:#8d9693;--k:#53fc18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Rubik,Arial,sans-serif;overflow-x:hidden}
.hide{display:none!important}
.logo{font-weight:800;font-size:2.6rem;letter-spacing:.04em;color:var(--k);direction:ltr}
.logo small{color:var(--ink);font-size:1rem;letter-spacing:0;margin-inline-start:10px;font-weight:600}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--k);outline-offset:2px}
.btn{background:var(--k);color:#0b0e0f;font-weight:800;border:0;border-radius:8px;padding:13px 18px;font-size:1.05rem}
.btn.g{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:1.05rem}
.grid{display:grid;gap:10px}
.inp{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1.1rem}
.inp.c{text-align:center;letter-spacing:.2em;text-transform:uppercase;direction:ltr}
select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.set{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.code{font-size:2.2rem;font-weight:800;color:var(--k);letter-spacing:.25em;text-align:center;direction:ltr}
.pl{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.chip i{width:12px;height:12px;border-radius:50%}
.chip.me{border-color:var(--k)}
.chip img{width:28px;height:28px;border-radius:50%}
.mute{color:var(--mute);font-size:.9rem}
#game{display:flex;flex-direction:column;min-height:100vh}
.hud{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
.timer{height:8px;background:var(--line);margin:0 16px;border-radius:9px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--k);transform-origin:right}
.qbig{margin:14px 16px 0;padding:16px 14px;text-align:center;font-weight:800;font-size:clamp(2rem,8vw,3.4rem);line-height:1.1;color:#0b0e0f;background:var(--k);border-radius:12px}
.stage{padding:14px 8px 0}
.world{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.pc{display:flex;flex-direction:column;align-items:center;width:92px;gap:4px}
.pc img{width:72px;height:72px;border-radius:12px;border:3px solid var(--line)}
.pc.me img{border-color:var(--k)}
.tag{font-weight:800;font-size:.85rem;text-align:center}
.tag.me{color:var(--k)}
.bub{background:var(--k);color:#0b0e0f;border-radius:8px;padding:2px 6px;font-weight:800;font-size:.8rem;text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;padding:14px 16px}
.opt{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 6px 10px;font-weight:800;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;gap:6px}
.opt img{width:100%;max-width:130px;aspect-ratio:1;border-radius:8px}
.opt:hover:not(:disabled){border-color:var(--k)}
.opt.on{background:var(--k);color:#0b0e0f;border-color:var(--k)}
.opt:disabled{opacity:.55;cursor:default}
.opt.on:disabled{opacity:1}
@media (max-width:480px){.opts{grid-template-columns:repeat(2,1fr)}}
.msg{text-align:center;padding:10px 16px 0;min-height:28px;font-weight:600}
.rev{padding:6px 16px 90px}
.rev div{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.rev b{color:var(--k);display:flex;align-items:center;gap:8px}
.rev img{width:30px;height:30px;border-radius:50%}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:600}
.bar img{width:38px;height:38px;border-radius:8px}
.bar .n{width:70px}
.bar .t{flex:1;height:20px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--k)}
#aud{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 14px 4px 6px}
#mus{border-radius:50%;width:38px;height:38px;background:var(--bg);border:1px solid var(--line);font-size:1.1rem}
#vol{width:90px;accent-color:var(--k)}
body.inlobby{background:radial-gradient(circle at 15% 8%,rgba(83,252,24,.2),transparent 42%),radial-gradient(circle at 88% 78%,rgba(76,201,240,.16),transparent 45%),var(--bg)}
body.inlobby::before{content:"";position:fixed;left:-30%;right:-30%;bottom:0;height:60vh;background:linear-gradient(rgba(83,252,24,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(83,252,24,.16) 1px,transparent 1px);background-size:56px 56px;transform:perspective(380px) rotateX(62deg);transform-origin:bottom;animation:grid 4s linear infinite;pointer-events:none;-webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent)}
@keyframes grid{to{background-position:0 56px}}
#lobby{position:relative;z-index:1}#lobby .card{background:rgba(22,25,27,.82);backdrop-filter:blur(6px)}
.kick{border:0;background:transparent;color:#ff4d6d;font-weight:800;padding:0 4px;font-size:1rem}
#side{position:fixed;top:0;bottom:0;inset-inline-start:0;width:280px;max-width:86vw;background:var(--panel);border-inline-end:1px solid var(--line);z-index:6;padding:14px;overflow:auto;transform:translateX(105%);transition:transform .2s}
#side.open{transform:none}#side h4{margin:14px 0 8px;color:var(--k)}
.sp{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
@media (min-width:1000px){#game.sb{padding-inline-start:290px}}
#micb.on{border-color:var(--k)}#aud button{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.mb{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:380px;width:100%;display:grid;gap:12px;max-height:90vh;overflow:auto}
.mb h3{margin:0;font-size:1.1rem}.mb p{margin:0}.mr{display:grid;gap:8px}.mr .btn{width:100%}
.btn.d{background:#ff4d6d;color:#0b0e0f}
#setb{border-radius:50%;width:38px;height:38px;background:var(--bg);border:1px solid var(--line);font-size:1.1rem}
.cr{display:flex;gap:14px;align-items:flex-start}.cr img{width:96px;height:96px;border-radius:12px;flex:none}.cr .grid{flex:1;min-width:0}
.crow{display:grid;gap:4px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);padding:0}.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--k)}
.st{padding:4px 9px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:.85rem}.st.on{background:var(--k);color:#0b0e0f;border-color:var(--k)}
.hq{display:flex;flex-direction:column;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}.hq b{color:var(--k)}
body{padding-left:56px}#aud{left:68px}
#nav{position:fixed;left:0;top:0;bottom:0;width:56px;background:var(--panel);border-right:1px solid var(--line);z-index:25;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
#nav button{width:48px;padding:6px 0;background:transparent;border:0;border-radius:8px;font-size:1.2rem;display:flex;flex-direction:column;align-items:center}
#nav small{font-size:.6rem;color:var(--mute)}
#dr{position:fixed;left:56px;top:0;bottom:0;width:340px;max-width:calc(100vw - 56px);background:var(--panel);border-right:1px solid var(--line);z-index:24;padding:16px;overflow:auto;display:grid;gap:12px;align-content:start}
#dr h3{margin:0}.dh{display:flex;justify-content:space-between;align-items:center}
.meter{height:14px;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--line)}.meter i{display:block;height:100%;width:0;background:var(--k)}
.hl b{color:var(--k);display:block;margin-top:8px}.hl p{margin:2px 0}
</style>
</head>
<body class="inlobby">
<nav id="nav"><button data-p="home" aria-label="ראשי">🏠<small>ראשי</small></button><button data-p="prof" aria-label="פרופיל">👤<small>פרופיל</small></button><button data-p="set" aria-label="הגדרות">⚙️<small>הגדרות</small></button><button data-p="help" aria-label="הסבר">❓<small>הסבר</small></button></nav>
<aside id="dr" class="hide"><div class="dh"><h3 id="drt"></h3><button class="btn g" id="drx" style="padding:4px 10px" aria-label="סגור">✕</button></div><div id="drb" class="grid"></div></aside>
<div id="aud"><button id="micb" class="hide" style="border-radius:50%;width:38px;height:38px;background:var(--bg);border:1px solid var(--line)" aria-label="צ'אט קולי">🎤</button><button id="mutb" class="hide" style="border-radius:50%;width:38px;height:38px;background:var(--bg);border:1px solid var(--line)" aria-label="השתק מיקרופון">🎙️</button><button id="mus" aria-label="השתק או הפעל מוזיקה">🔊</button><input type="range" id="vol" min="0" max="100" value="50" aria-label="עוצמת מוזיקה"></div>

<section id="lobby" class="wrap">
  <div class="logo">KICK<small>מי הכי?</small></div>
  <p class="mute">כל שחקן נכנס עם השם שלו, ובכל סיבוב מצביעים מי מבין הדמויות הכי מתאים לשאלה.</p>
  <div id="menu">
    <div class="card grid">
      <button class="btn" id="mk">צור שרת פרטי</button>
      <button class="btn g" id="jb">הצטרפות עם קוד</button>
      <div class="grid hide" id="jbox" style="grid-template-columns:1fr auto">
        <input class="inp c" id="jc" maxlength="5" inputmode="numeric" pattern="[0-9]*" placeholder="קוד (5 ספרות)" aria-label="קוד שרת">
        <button class="btn" id="jn">הצטרף</button>
      </div>
      <button class="btn g" id="solo">משחק מהיר לבד (עם בוטים)</button>
    </div>
  </div>
  <div id="room" class="hide">
    <div class="card"><button class="btn g" id="back" style="width:100%;margin-bottom:10px">← חזרה ללובי הראשי</button><div class="code" id="rc"></div>
      <button class="btn" id="vc" style="width:100%;margin-top:10px">🎤 הצטרף לשיחה קולית</button>
      <button class="btn g" id="cp" style="width:100%;margin-top:10px">העתק קישור הזמנה</button>
      <p class="mute" id="note" style="margin:10px 0 0"></p></div>
    <div class="card"><h3>שחקנים (עד 8)</h3><div class="pl" id="pls"></div>
      <button class="btn g hide" id="bot" style="margin-top:12px">הוסף בוט</button></div>
    <div class="card"><h3>על מי מצביעים</h3>
      <div class="grid hide" id="candin"><div class="set"><span>כמה אנשים להצבעה</span><select id="nc"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div></div>
      <div class="pl hide" id="candls"></div>
      <p class="mute hide" id="chint" style="margin:10px 0 0">המארח יכול לשנות את השמות.</p></div>
    <div class="card hide" id="cfg"><h3>הגדרות</h3>
      <div class="set"><span>מספר סיבובים</span><select id="cn"><option>5</option><option selected>10</option><option>15</option></select></div>
      <div class="set"><span>שניות לסיבוב</span><select id="cs"><option>10</option><option selected>15</option><option>20</option><option>30</option></select></div>
    </div>
    <button class="btn hide" id="go" style="width:100%">התחל משחק</button>
    <p class="mute hide" id="wait" style="text-align:center">ממתינים שהמארח יתחיל…</p>
  </div>
</section>

<section id="game" class="hide">
  <div class="hud"><span class="logo" style="font-size:1.4rem">KICK</span><b id="rn"></b><span id="tl" class="mute"></span><span><button class="btn g" id="sbt" style="padding:6px 10px" aria-label="דירוג">📊</button> <button class="btn g" id="ex" style="padding:6px 10px">יציאה</button></span></div>
  <div class="timer"><i id="tb"></i></div>
  <div class="qbig" id="qb"></div>
  <div class="stage"><div class="world" id="world"></div></div>
  <div class="msg" id="msg"></div>
  <div class="opts" id="opts"></div>
  <button class="btn" id="lock" style="margin:0 16px 14px">🔒 נעל תשובה</button>
  <div class="rev hide" id="rev"></div>
  <aside id="side"><b>📊 דירוג</b><div id="sbody"></div></aside>
</section>

<section id="end" class="wrap hide">
  <div class="logo">התוצאות</div>
  <h2 id="win"></h2><p class="mute" id="elim"></p>
  <div class="card" id="tally"></div>
  <button class="btn" id="again" style="width:100%">חזרה ללובי</button>
  <button class="btn g hide" id="ex2" style="width:100%;margin-top:10px">יציאה מהמשחק</button>
</section>

<div id="hold" class="hide"><div id="profbox" class="grid">
<label for="pn"><b>השם שלך</b></label>
<input class="inp" id="pn" maxlength="12" placeholder="כתוב כאן את השם שלך" autocomplete="off">
<b>הדמות שלך</b>
<div class="cr"><img id="pv" alt="הדמות שלך"><div class="grid" id="crc"></div></div>
<div class="grid" style="grid-template-columns:1fr 1fr"><button class="btn g" id="upb" type="button">📁 תמונה מהמחשב</button><button class="btn g" id="drw" type="button">🎨 צייר דמות</button></div>
<input type="file" id="up" accept="image/*" class="hide">
</div></div>
<script>
const DEF=["עודד","מיכאל","סנסי","רונן","דמות 5","דמות 6","דמות 7","דמות 8"];
const CC=["#53fc18","#ff4d6d","#4cc9f0","#ffb703"];
const PC=["#53fc18","#ff4d6d","#4cc9f0","#ffb703","#b388ff","#ff8a3d","#2ec4b6","#d8d8d8"];
const POS=[{x:0,z:30},{x:-170,z:-60},{x:170,z:-60},{x:-300,z:40},{x:300,z:40},{x:-90,z:-150},{x:90,z:-150},{x:0,z:-100}];
const HAIR=["#2b2118","#e8d9b0","#7a3b1e","#111","#c0392b"];
const POOL=["מי הכי חתיך?","מי הכי מצחיק?","מי הכי יזכה בטורניר?","מי הכי מאחר?","מי הכי יברח ראשון מסרט אימה?","מי הכי יסתבך בצרות?","מי הכי טוב במטבח?","מי הכי ישן עד הצהריים?","מי הכי ילחץ במשחק האחרון?","מי הכי יהיה סטרימר מפורסם?","מי הכי חכם?","מי הכי ינצח בקרב מילים?"];
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- avatars ---------- */
const COL=["#53fc18","#ff4d6d","#4cc9f0","#ffb703","#b388ff","#ff8a3d"];
const HC=["#2b2118","#e8d9b0","#7a3b1e","#111111","#c0392b","#8d9693"];
const SK=["#f0c8a0","#e0ac82","#c68642","#8d5524","#5c3a21","#ffdbc1"];
const EY=["#111111","#3b6ea5","#2e8b57","#7a4b1e","#6b6b6b"];
const HN=["קצר","מתולתל","ארוך","קירח","כובע"];
const AV=[5,6,6,5,6];
const rng=n=>Array.from({length:n},(_,i)=>i);
const rnd=()=>AV.map(m=>Math.floor(Math.random()*m));
const sa=a=>typeof a==="string"?(/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]{20,12000}$/.test(a)?a:[0,0,0,0,0]):Array.isArray(a)?AV.map((m,k)=>{const v=+a[k];return v>=0&&v<m?Math.floor(v):0}):[0,0,0,0,0];
const avCache={};
function pav(a){
  const k=a.join();if(avCache[k])return avCache[k];
  const h=HC[a[1]],hs=[
   `<path d="M32 52Q30 20 60 20Q90 20 88 52Q76 34 60 34Q44 34 32 52Z" fill="${h}"/>`,
   `<g fill="${h}"><circle cx="38" cy="38" r="12"/><circle cx="52" cy="28" r="13"/><circle cx="68" cy="28" r="13"/><circle cx="82" cy="38" r="12"/></g>`,
   `<path d="M30 62Q24 14 60 14Q96 14 90 62L90 96L76 96L76 48Q60 34 44 48L44 96L30 96Z" fill="${h}"/>`,
   `<path d="M35 46Q60 26 85 46Q60 36 35 46Z" fill="${h}" opacity=".45"/>`,
   `<path d="M32 48Q32 14 60 14Q88 14 88 48Z" fill="${h}"/><rect x="58" y="42" width="40" height="7" rx="3" fill="${h}" stroke="#0006"/>`];
  const e=EY[a[3]],s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="#20262a"/><path d="M12 120Q60 70 108 120Z" fill="${COL[a[4]]}"/><circle cx="60" cy="54" r="27" fill="${SK[a[2]]}"/>${hs[a[0]]}<circle cx="50" cy="56" r="5.2" fill="#fff"/><circle cx="70" cy="56" r="5.2" fill="#fff"/><circle cx="50" cy="56" r="3.2" fill="${e}"/><circle cx="70" cy="56" r="3.2" fill="${e}"/><path d="M49 68Q60 77 71 68" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
  return avCache[k]="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
}
const av=i=>pav([i%5,(i*5)%6,(i*2)%6,i%5,i%6]);
const mkimg=src=>{const e=document.createElement("img");e.src=src;e.alt="";return e};
const img=i=>mkimg(av(i)),imgA=a=>{a=sa(a);return mkimg(typeof a==="string"?a:pav(a))};

/* ---------- dialogs ---------- */
function modal(title,btns,body){return new Promise(res=>{
  const o=document.createElement("div");o.className="ov";const b=document.createElement("div");b.className="mb";
  const h=document.createElement("h3");h.textContent=title;b.append(h);if(body)b.append(body);
  const r=document.createElement("div");r.className="mr";
  btns.forEach(([tx,v,c])=>{const x=document.createElement("button");x.className="btn "+(c===undefined?"":c);x.textContent=tx;x.onclick=()=>{o.remove();res(v)};r.append(x)});
  b.append(r);o.append(b);document.body.append(o)})}
const ask=tx=>modal(tx,[["אישור",true,""],["ביטול",false,"g"]]);
window.alert=tx=>modal(String(tx),[["סגור",1,""]]);

/* ---------- network ---------- */
let rm=null,myPeer="local",H={},isHost=false,code="",online=false;
const hear=(t,f)=>(H[t]=H[t]||[]).push(f);
const fire=(t,d,m)=>(H[t]||[]).forEach(f=>f(d,m));
function send(t,d){ if(rm){return rm.emit(t,d).catch(()=>{})} else fire(t,d,{peer:"local",sameTab:true}) }
async function openRoom(c){
  code=c;
  try{
    const r=window.claude&&await window.claude.use("room");
    if(!r)throw 0;

  c.onpointermove=e=>{if(!dn)return;const[p,q]=pt(e);x.lineTo(p,q);x.stroke()};
  c.onpointerup=c.onpointercancel=()=>{dn=false};
  const bd=document.createElement("div");bd.className="grid";bd.append(c);
  const pal=document.createElement("div");pal.className="pl";
  ["#111111","#ffffff","#ff4d6d","#ffb703","#53fc18","#4cc9f0","#b388ff","#7a3b1e","#f0c8a0"].forEach(cl=>{const b=document.createElement("button");b.type="button";b.className="sw";b.style.background=cl;b.setAttribute("aria-label","צבע");b.onclick=()=>{col=cl};pal.append(b)});
  const sl=document.createElement("input");sl.type="range";sl.min=2;sl.max=24;sl.value=6;sl.setAttribute("aria-label","עובי מכחול");sl.oninput=()=>{sz=+sl.value};
  const cl=document.createElement("button");cl.type="button";cl.className="btn g";cl.textContent="נקה הכל";cl.onclick=()=>{x.fillStyle="#fff";x.fillRect(0,0,256,256)};
  bd.append(pal,sl,cl);
  if(await modal("צייר את הדמות שלך",[["שמור",1,""],["ביטול",0,"g"]],bd)){CUS=sq(c);drawMy()}
};
function drawMy(){$("pv").src=CUS||pav(MY);[...$("crc").querySelectorAll("button")].forEach(b=>b.classList.toggle("on",!CUS&&MY[b.dataset.k]==b.dataset.v));saveP();pushProfile()}
[["תסרוקת",0],["צבע שיער",1,HC],["צבע עור",2,SK],["עיניים",3,EY],["בגד",4,COL]].forEach(([lab,k,pal])=>{

/* ---------- music ---------- */
let ac=null,mOn=true,step=0,vol=.5;
const setVol=()=>{if(ac)ac.out.gain.value=mOn?vol*.3:0};
function audioInit(){
  if(ac){if(ac.state==="suspended")ac.resume();return}
  try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  const g=ac.createGain();g.connect(ac.destination);ac.out=g;setVol();if(ac.setSinkId)ac.setSinkId(outId).catch(()=>{});
  const bass=[55,55,65.4,49],arp=[220,261.6,329.6,261.6,196,246.9,293.7,246.9];
  const tone=(f,t,d,type,v)=>{const o=ac.createOscillator(),e=ac.createGain();o.type=type;o.frequency.value=f;e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(e);e.connect(g);o.start(t);o.stop(t+d)};
  setInterval(()=>{
    if(!mOn||vol===0||ac.state!=="running")return;
    const t=ac.currentTime+.05,s=step%16;
    if(s%4===0){const o=ac.createOscillator(),e=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);e.gain.setValueAtTime(1,t);e.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(e);e.connect(g);o.start(t);o.stop(t+.2)}
    if(s%2===1)tone(8000,t,.04,"square",.05);
    if(s%4===0)tone(bass[Math.floor(step/16)%4],t,.4,"sawtooth",.35);
    tone(arp[s%8]*(Math.floor(step/16)%4===2?.75:1),t,.12,"square",.12);
    step++;
  },150);
}
$("mus").onclick=()=>{audioInit();mOn=!mOn;$("mus").textContent=mOn?"🔊":"🔇";setVol()};
$("vol").oninput=e=>{audioInit();vol=e.target.value/100;if(!mOn&&vol>0){mOn=true;$("mus").textContent="🔊"}setVol()};

/* ---------- settings: mic / headphones ---------- */
let micId="",outId="";
try{micId=localStorage.getItem("kmic")||"";outId=localStorage.getItem("kout")||""}catch(e){}
const sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function applyOut(){Object.values(pcs).forEach(c=>{if(c.au.setSinkId)c.au.setSinkId(outId).catch(()=>{})});if(ac&&ac.setSinkId)ac.setSinkId(outId).catch(()=>{})}
async function openSettings(){
  let devs=[];
  try{
    devs=await navigator.mediaDevices.enumerateDevices();
    if(devs.some(d=>d.kind==="audioinput"&&!d.label)){const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(x=>x.stop());devs=await navigator.mediaDevices.enumerateDevices()}
  }catch(e){}
  const body=document.createElement("div");body.className="grid";
  const mk=(lab,kind,cur,on)=>{
    const w=document.createElement("label");w.className="grid";w.textContent=lab;
    const s=document.createElement("select");s.className="inp";s.add(new Option("ברירת מחדל של המערכת",""));
    devs.filter(d=>d.kind===kind).forEach((d,i)=>s.add(new Option(d.label||(lab+" "+(i+1)),d.deviceId)));
    s.value=cur;if(s.value!==cur)s.value="";
    s.onchange=()=>on(s.value);w.append(s);return w};
  body.append(mk("🎤 מיקרופון","audioinput",micId,v=>{micId=v;sv("kmic",v);if(mic){stopVoice();startVoice()}}));
  if("setSinkId" in HTMLMediaElement.prototype)body.append(mk("🎧 אוזניות / רמקולים","audiooutput",outId,v=>{outId=v;sv("kout",v);applyOut()}));
  else{const p=document.createElement("p");p.className="mute";p.textContent="הדפדפן הזה לא תומך בבחירת אוזניות. הוא ישתמש בברירת המחדל של המערכת.";body.append(p)}
  if(!devs.length){const p=document.createElement("p");p.className="mute";p.textContent="לא נמצאו התקנים. בדוק הרשאות מיקרופון בדפדפן.";body.append(p)}
  const mt=document.createElement("div");mt.className="grid";
  const mb=document.createElement("button");mb.type="button";mb.className="btn g";mb.textContent="🎙️ בדוק מיקרופון";
  const mm=document.createElement("div");mm.className="meter";const mi=document.createElement("i");mm.append(mi);
  const ms=document.createElement("p");ms.className="mute";ms.textContent="לחץ ותדבר: הפס אמור לזוז.";
  mb.onclick=()=>micTest(mb,mi,ms);mt.append(mb,mm,ms);body.append(mt);
  openDr("הגדרות",body,"set");
}
let stopTest=null;
async function micTest(btn,bar,st){
  if(stopTest){stopTest();return}
  let s;try{s=await navigator.mediaDevices.getUserMedia({audio:{deviceId:micId?{ideal:micId}:undefined}})}catch(e){st.textContent="❌ אין גישה למיקרופון. אפשר הרשאה בדפדפן.";return}
  const ctx=new (window.AudioContext||window.webkitAudioContext)(),an=ctx.createAnalyser();an.fftSize=512;ctx.createMediaStreamSource(s).connect(an);
  const d=new Uint8Array(an.fftSize);let mx=0,raf;
  const loop=()=>{an.getByteTimeDomainData(d);let m=0;d.forEach(v=>{m=Math.max(m,Math.abs(v-128))});const l=Math.min(1,m/64);mx=Math.max(mx,l);bar.style.width=l*100+"%";st.textContent=mx>.12?"✅ המיקרופון עובד, שומעים אותך":"🎙️ תדבר עכשיו…";raf=requestAnimationFrame(loop)};
  loop();btn.textContent="עצור בדיקה";
  stopTest=()=>{cancelAnimationFrame(raf);s.getTracks().forEach(x=>x.stop());ctx.close();stopTest=null;btn.textContent="🎙️ בדוק מיקרופון";bar.style.width="0"};
}
function openDr(title,node,name){
  if(stopTest)stopTest();
  const prev=$("drb").firstChild;if(prev&&prev.id==="profbox"&&prev!==node)$("hold").append(prev);
  $("drb").replaceChildren(node);$("drt").textContent=title;$("dr").dataset.n=name;$("dr").classList.remove("hide");
}
function closeDr(){
  if(stopTest)stopTest();
  const prev=$("drb").firstChild;if(prev&&prev.id==="profbox")$("hold").append(prev);
  $("dr").dataset.n="";$("dr").classList.add("hide");
}

  const w=document.createElement("div");w.className="hl";
  [["מה המשחק?","בכל סיבוב מופיעה שאלה כמו \"מי הכי מצחיק?\" וכל שחקן מצביע על אחת הדמויות."],

   ["הדחה","בסוף כל משחק הדמות עם הכי הרבה קולות מודחת וקמה משחק חדש בלעדיה. הדמות האחרונה שנשארת מנצחת."],
   ["שרת וחברים","לוחצים \"צור שרת פרטי\" ושולחים לחברים את הקישור או את הקוד. המארח קובע סיבובים, זמן ומספר דמויות, ויכול לעשות קיק או באן."],
   ["שיחה קולית","בלובי לוחצים \"הצטרף לשיחה קולית\" כדי לדבר עם כולם. בהגדרות בוחרים מיקרופון ואוזניות ובודקים שהמיקרופון עובד."],
   ["פרופיל","בפרופיל בוחרים שם ודמות: בונים דמות, מעלים תמונה מהמחשב או מציירים."],
   ["דירוג","הכפתור 📊 במשחק מראה בכל משחק מי קיבל הכי הרבה קולות בכל שאלה."]
  ].forEach(([h,p])=>{const a=document.createElement("b");a.textContent=h;const q=document.createElement("p");q.textContent=p;w.append(a,q)});
  openDr("איך משחקים?",w,"help");
}
